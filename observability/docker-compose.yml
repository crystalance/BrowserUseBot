# Local observability stack — Langfuse (self-hosted, dev).
#
# Portable: works identically on Windows & macOS with Docker Desktop.
#   Start:  docker compose -f observability/docker-compose.yml up -d
#   UI:     http://localhost:3000   (login below)
#   Stop:   docker compose -f observability/docker-compose.yml down
#
# Langfuse v2 = 2 containers (web + postgres). Auto-provisions an org/project/user
# and FIXED API keys via LANGFUSE_INIT_*, so the bot's .env keys are known ahead
# of time — no manual dashboard setup. Dev-only creds; do NOT reuse in prod.

services:
  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-me
      SALT: dev-salt-change-me
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: browseruse
      LANGFUSE_INIT_PROJECT_ID: browseruse-bot
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dev-browseruse
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dev-browseruse
      LANGFUSE_INIT_USER_EMAIL: dev@local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: langfuse-dev

volumes:
  langfuse_pgdata:
